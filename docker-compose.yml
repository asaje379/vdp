services:

  migrate:
    build:
      context: ./api
      dockerfile: core.Dockerfile
    command: npm run migrate:prod
    environment:
      - APP_PORT=${APP_PORT}
      - TIMER_PORT=${TIMER_PORT}
      - CORE_URL=${CORE_URL}
      - TIMER_URL=${TIMER_URL}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?schema=public
      - O_API_TITLE=${O_API_TITLE}
      - O_API_VERSION=${O_API_VERSION}
      - O_API_BASE_URL=${O_API_BASE_URL}
      - AUTH_TOKEN_SECRET=${AUTH_TOKEN_SECRET}
      - AUTH_TOKEN_EXPIRATION=${AUTH_TOKEN_EXPIRATION}

  app:
    build:
      context: ./api
      dockerfile: core.Dockerfile
    restart: always
    ports:
      - 7000:9411
    command: npm run start:core
    environment:
      - APP_PORT=${APP_PORT}
      - TIMER_PORT=${TIMER_PORT}
      - CORE_URL=${CORE_URL}
      - TIMER_URL=${TIMER_URL}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?schema=public
      - O_API_TITLE=${O_API_TITLE}
      - O_API_VERSION=${O_API_VERSION}
      - O_API_BASE_URL=${O_API_BASE_URL}
      - AUTH_TOKEN_SECRET=${AUTH_TOKEN_SECRET}
      - AUTH_TOKEN_EXPIRATION=${AUTH_TOKEN_EXPIRATION}
    networks:
      - openeco

  timer:
    build:
      context: ./api
      dockerfile: timer.Dockerfile
    restart: always
    ports:
      - 7001:9412
    command: npm run start:timer
    environment:
      - APP_PORT=${APP_PORT}
      - TIMER_PORT=${TIMER_PORT}
      - CORE_URL=${CORE_URL}
      - TIMER_URL=${TIMER_URL}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?schema=public
      - O_API_TITLE=${O_API_TITLE}
      - O_API_VERSION=${O_API_VERSION}
      - O_API_BASE_URL=${O_API_BASE_URL}
      - AUTH_TOKEN_SECRET=${AUTH_TOKEN_SECRET}
      - AUTH_TOKEN_EXPIRATION=${AUTH_TOKEN_EXPIRATION}
    networks:
      - openeco

networks:
  openeco:
